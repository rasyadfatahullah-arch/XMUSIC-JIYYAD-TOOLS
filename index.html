<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMUSIC - by JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  /* ================= BASE ================= */
  :root {
    --bg: #0a0a0f;
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent: #8a2be2;
    --accent-glow: rgba(138, 43, 226, 0.4);
    --text: #ffffff;
    --text-muted: #a0a0a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 120px; /* Space for player */
    overflow-x: hidden;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(0, 191, 255, 0.1), transparent 25%);
    background-attachment: fixed;
  }
  svg { fill: currentColor; }

  /* ================= NAVBAR ================= */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 100;
    border-bottom: 1px solid var(--glass-border);
  }
  .brand {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand svg { width: 28px; height: 28px; fill: var(--accent); }
  .owner-badge {
    font-size: 12px;
    font-weight: 600;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 6px 14px;
    border-radius: 20px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ================= SEARCH ================= */
  .search-section {
    padding: 110px 5% 30px;
    text-align: center;
  }
  .search-title { font-size: 32px; font-weight: 800; margin-bottom: 20px; }
  .search-box {
    display: flex;
    align-items: center;
    max-width: 600px;
    margin: 0 auto;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    padding: 10px 20px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .search-box svg { width: 24px; height: 24px; color: var(--text-muted); }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    padding: 10px;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  /* ================= GRID & CARDS ================= */
  .container { padding: 0 5%; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
    padding-bottom: 40px;
  }
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(138, 43, 226, 0.15);
  }
  .card-img-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 12px;
    overflow: hidden;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card-play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .card:hover .card-play-overlay { opacity: 1; }
  .card-play-overlay svg { width: 48px; height: 48px; fill: #fff; }
  
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-wrap: break-word;
  }
  .card-artist {
    font-size: 13px;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ================= PLAYER BAR ================= */
  .player-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 90px;
    background: rgba(15, 15, 20, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    padding: 0 5%;
    z-index: 1000;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .player-bar.active { transform: translateY(0); }
  
  .player-info {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 30%;
    min-width: 200px;
  }
  .player-img {
    width: 56px; height: 56px;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .player-text { overflow: hidden; }
  .player-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-controls {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .buttons { display: flex; align-items: center; gap: 20px; }
  .btn-ctrl {
    background: none; border: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-ctrl:hover { color: #fff; }
  .btn-ctrl svg { width: 20px; height: 20px; }
  .btn-play-pause {
    width: 44px; height: 44px;
    background: #fff; color: #000;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .btn-play-pause:hover { transform: scale(1.05); color: #000; }
  .btn-play-pause svg { width: 24px; height: 24px; }

  .progress-container {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-bar-bg {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .progress-bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -6px; top: -4px;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .progress-bar-bg:hover .progress-bar-fill::after { opacity: 1; }

  /* ================= LOADING & STATES ================= */
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 16px; }

  /* Responsive */
  @media (max-width: 768px) {
    .player-info { display: none; }
    .player-controls { width: 100%; }
    .brand { font-size: 20px; }
    .owner-badge { font-size: 10px; padding: 4px 10px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    XMUSIC
  </div>
  <div class="owner-badge">by JIYYAD TOOLS</div>
</nav>

<section class="search-section">
  <h1 class="search-title">Cari Lagu Favoritmu</h1>
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Ketik judul lagu atau nama artis..." autocomplete="off">
  </div>
</section>

<div class="container">
  <div id="loading" class="spinner" style="display:none;"></div>
  <div id="empty" class="empty-state" style="display:none;">Lagu tidak ditemukan. Coba kata kunci lain.</div>
  <div class="grid" id="resultsGrid"></div>
</div>

<!-- AUDIO PLAYER BAR -->
<div class="player-bar" id="playerBar">
  <div class="player-info">
    <img src="" id="playerImg" class="player-img" alt="Cover">
    <div class="player-text">
      <div class="player-title" id="playerTitle">-</div>
      <div class="player-artist" id="playerArtist">-</div>
    </div>
  </div>
  
  <div class="player-controls">
    <div class="buttons">
      <button class="btn-ctrl" onclick="prevSong()">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn-ctrl btn-play-pause" id="playPauseBtn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn-ctrl" onclick="nextSong()">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    
    <div class="progress-container">
      <span id="currTime">0:00</span>
      <div class="progress-bar-bg" id="progressBar" onclick="seek(event)">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span id="totalTime">0:00</span>
    </div>
  </div>
</div>

<script>
/* ================= STATE ================= */
const API_BASE = 'https://saavn.dev/api';
let songsList = [];
let currentIndex = -1;
let isPlaying = false;
const audio = new Audio();
let searchTimeout;

/* ================= SEARCH LOGIC ================= */
const searchInput = document.getElementById('searchInput');

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  
  if (q.length === 0) {
    document.getElementById('resultsGrid').innerHTML = '';
    document.getElementById('empty').style.display = 'none';
    return;
  }
  
  if (q.length > 1) {
    searchTimeout = setTimeout(() => {
      searchMusic(q);
    }, 600); // Debounce 600ms
  }
});

async function searchMusic(query) {
  const grid = document.getElementById('resultsGrid');
  const loader = document.getElementById('loading');
  const empty = document.getElementById('empty');
  
  loader.style.display = 'block';
  grid.innerHTML = '';
  empty.style.display = 'none';

  try {
    const res = await fetch(`${API_BASE}/search/songs?query=${encodeURIComponent(query)}&limit=20`);
    const json = await res.json();
    
    if (!json.data || !json.data.results || json.data.results.length === 0) {
      empty.style.display = 'block';
      return;
    }

    songsList = json.data.results.map(s => ({
      id: s.id,
      title: s.name,
      artist: s.artists.primary.map(a => a.name).join(', '),
      cover: s.image[2]?.url || s.image[1]?.url || '',
      url: s.downloadUrl[4]?.url || s.downloadUrl[3]?.url || s.downloadUrl[2]?.url
    }));

    renderGrid();
  } catch (err) {
    console.error(err);
    empty.textContent = 'Terjadi kesalahan saat mencari lagu.';
    empty.style.display = 'block';
  } finally {
    loader.style.display = 'none';
  }
}

/* ================= RENDER GRID ================= */
function renderGrid() {
  const grid = document.getElementById('resultsGrid');
  grid.innerHTML = songsList.map((s, i) => `
    <div class="card" onclick="playSong(${i})">
      <div class="card-img-wrapper">
        <img src="${s.cover}" alt="${s.title}" loading="lazy">
        <div class="card-play-overlay">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="card-title">${s.title}</div>
      <div class="card-artist">${s.artist}</div>
    </div>
  `).join('');
}

/* ================= AUDIO PLAYER LOGIC ================= */
const playerBar = document.getElementById('playerBar');
const playerImg = document.getElementById('playerImg');
const playerTitle = document.getElementById('playerTitle');
const playerArtist = document.getElementById('playerArtist');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const progressFill = document.getElementById('progressFill');
const currTimeEl = document.getElementById('currTime');
const totalTimeEl = document.getElementById('totalTime');

function playSong(index) {
  if (index < 0 || index >= songsList.length) return;
  
  currentIndex = index;
  const song = songsList[currentIndex];
  
  // Update UI
  playerBar.classList.add('active');
  playerImg.src = song.cover;
  playerTitle.textContent = song.title;
  playerArtist.textContent = song.artist;
  
  // Load & Play Audio
  audio.src = song.url;
  audio.play().then(() => {
    isPlaying = true;
    updatePlayState();
  }).catch(err => {
    console.error('Playback error:', err);
    alert('Gagal memutar lagu. Server sumber mungkin sedang sibuk.');
  });
}

function togglePlay() {
  if (currentIndex === -1) return;
  if (isPlaying) {
    audio.pause();
  } else {
    audio.play();
  }
  isPlaying = !isPlaying;
  updatePlayState();
}

function updatePlayState() {
  if (isPlaying) {
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
  } else {
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  }
}

function nextSong() {
  if (songsList.length === 0) return;
  let nextIdx = (currentIndex + 1) % songsList.length;
  playSong(nextIdx);
}

function prevSong() {
  if (songsList.length === 0) return;
  let prevIdx = (currentIndex - 1 + songsList.length) % songsList.length;
  playSong(prevIdx);
}

/* ================= PROGRESS BAR ================= */
function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = `${percent}%`;
    currTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
  }
});

audio.addEventListener('ended', () => {
  nextSong();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayState();
});

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayState();
});

function seek(e) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const percent = clickX / rect.width;
  
  if (audio.duration) {
    audio.currentTime = percent * audio.duration;
  }
}

/* ================= INIT ================= */
// Load lagu default saat web dibuka
window.addEventListener('DOMContentLoaded', () => {
  searchMusic('lofi chill');
});
</script>
</body>
</html>
